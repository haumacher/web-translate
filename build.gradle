// Root build.gradle for web-translate multi-module project

plugins {
    id 'net.researchgate.release' version '3.1.0'
}

subprojects {
    repositories {
        mavenCentral()
    }
}

// Task to synchronize version to all Maven POMs
tasks.register('updateMavenVersion') {
    group = 'versioning'
    description = 'Update all Maven POM versions to match gradle.properties'

    doLast {
        // Update parent POM and all modules using Maven versions plugin
        exec {
            commandLine 'mvn', '-q', 'versions:set', "-DnewVersion=${project.version}", '-DgenerateBackupPoms=false'
        }
        println "Updated all Maven POMs to version ${project.version}"
    }
}

// Configure release plugin
release {
    // Use git for version control
    git {
        requireBranch.set('master')
        pushToRemote.set('origin')
        signTag.set(false)
    }

    // Version update strategy
    versionPropertyFile = 'gradle.properties'

    // Tasks to run before release
    preTagCommitMessage = 'Release version'
    tagCommitMessage = 'Release version'
    newVersionCommitMessage = 'Prepare for next development iteration'

    // Don't push automatically - let user review first
    pushReleaseVersionBranch.set('master')
}

// Hook Maven version update into release lifecycle
afterReleaseBuild.dependsOn updateMavenVersion
beforeReleaseBuild.dependsOn updateMavenVersion
